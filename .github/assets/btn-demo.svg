<svg xmlns="http://www.w3.org/2000/svg" width="186" height="56" viewBox="0 -2 186 58" role="img" aria-label="Live demo"><title>Live demo</title>
<defs><filter id="b20" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter></defs>
<style>
.d{font-family:'Clash Display','Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:800}
.s{font-family:Satoshi,Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.18em}
.pulse{animation:p 2.2s cubic-bezier(.16,1,.3,1) infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.sweep{animation:sw 4.5s cubic-bezier(.32,.72,0,1) infinite}
@keyframes sw{0%{transform:translateX(-400px)}60%,100%{transform:translateX(1700px)}}
.spin{animation:r 18s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pulse,.sweep,.spin{animation:none}}
</style><g transform="translate(0 0)">
<rect x="10" y="14" width="166" height="40" rx="20" fill="#C6FF00" opacity=".45" filter="url(#b20)"/>
<rect width="186" height="52" rx="26" fill="#C6FF00"/>
<rect x="1" y="1" width="184" height="25" rx="25" fill="#fff" fill-opacity=".22"/>
<rect x="1" y="49" width="184" height="2" rx="1" fill="#000" fill-opacity=".18"/>
<text x="26" y="32" class="s" font-size="16" font-weight="700" fill="#0A0A0B">Live demo</text>
<circle cx="159" cy="26" r="16" fill="#0A0A0B"/>
<path d="M153 26h12m-4.5-4.5 4.5 4.5-4.5 4.5" stroke="#C6FF00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>